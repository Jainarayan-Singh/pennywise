<div id="toast-region" class="toast-region" role="region" aria-label="Notifications"></div>

<div id="page-transition" class="page-transition" role="status" aria-live="polite" hidden>
    <div class="splash">
        <div class="splash__mark" aria-hidden="true">
            <svg class="splash__ring" viewBox="0 0 96 96">
                <circle class="splash__track" cx="48" cy="48" r="44"/>
                <circle class="splash__arc" cx="48" cy="48" r="44"/>
            </svg>
            {{ brand_logo("splash__logo") }}
        </div>
        <p class="splash__name brand-name">{{ app_name }}</p>
        <p id="page-transition-text" class="splash__message"></p>
        <div class="splash__progress" aria-hidden="true"><span class="splash__bar"></span></div>
    </div>
</div>

<dialog id="confirm-dialog" class="modal modal--confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message" data-light-dismiss>
    <form class="modal__form" id="confirm-form" novalidate>
        <div class="modal__body confirm">
            <span class="modal__icon" id="confirm-icon">{{ icon("alert-triangle") }}</span>
            <h2 class="confirm__title" id="confirm-title"></h2>
            <p class="confirm__message" id="confirm-message"></p>
            <div class="alert alert--danger confirm__error" id="confirm-error" role="alert" hidden>{{ icon("alert-circle") }}<span></span></div>
        </div>
        <div class="modal__footer">
            <button class="btn btn--secondary" type="button" id="confirm-cancel">Cancel</button>
            <button class="btn btn--danger" type="submit" id="confirm-accept">Confirm</button>
        </div>
    </form>
</dialog>
