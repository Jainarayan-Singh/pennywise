{% from "components/macros.html" import icon, brand_video, theme_menu %}
<header class="site-header">
    <div class="container site-header__inner">
        <a class="brand" href="{{ url_for('main.landing') }}">
            {{ brand_video(app_name) }}
        </a>
        <nav class="site-nav" aria-label="Sections">
            <a href="{{ url_for('main.landing') }}#features">Features</a>
            <a href="{{ url_for('main.landing') }}#how-it-works">How it works</a>
        </nav>
        <div class="site-header__actions">
            {% if hub_url %}<a class="btn btn--ghost btn--sm site-header__hub" href="{{ hub_url }}" aria-label="Back to {{ hub_name }}">&larr;<span class="site-header__hub-name"> {{ hub_name }}</span></a>{% endif %}
            {{ theme_menu() }}
            {% if current_user() %}
            <a class="btn btn--primary btn--sm" href="{{ url_for('finance_pages.dashboard_page') }}">Dashboard</a>
            {% else %}
            <a class="btn btn--ghost btn--sm" href="{{ url_for('auth_pages.login_page') }}">Sign in</a>
            <a class="btn btn--primary btn--sm site-header__get-started" href="{{ url_for('auth_pages.login_page', tab='register') }}">Get started</a>
            {% endif %}
        </div>
    </div>
</header>
